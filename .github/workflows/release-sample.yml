name: Publish sample release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    uses: misaka310/ios-sidestore-deploy/.github/workflows/release.yml@bc210f5eb76af08a415488a8f0d4dde12c1d72af
    with:
      app_repository: ${{ github.repository }}
      app_ref: ${{ github.ref }}
      foundation_repository: misaka310/ios-sidestore-deploy
      foundation_ref: bc210f5eb76af08a415488a8f0d4dde12c1d72af
      release_tag: ${{ github.ref_name }}
      scheme: SideStoreSample
      project_path: SideStoreSample.xcodeproj
      configuration: Release
      app_name: SideStoreSample.app
      app_version: "1.0.3"
      build_number: "4"
      minimum_os_version: "17.0"
      release_name: SideStore Sample
      publish_source: true
      source_path: source/source.json
      source_url: https://misaka310.github.io/ios-sidestore-sample/source.json
      source_app_name: SideStore Sample
      source_developer_name: SideStore Deployment Foundation
      source_app_description: A minimal proof app for the SideStore deployment path.
    permissions:
      contents: write
      pages: write
      id-token: write
